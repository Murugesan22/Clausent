services:
  # CLAUSENT AI Contract Risk Analyzer - Unified Fullstack Service
  - type: web
    name: clausent-app
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: CLAUSENT
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: ENABLE_LEGAL_BERT
        value: "False"
      - key: SLM_PROVIDER
        value: mock_local
      - key: LLM_PROVIDER
        value: mock_local
      - key: TRANSLATION_PROVIDER
        value: indic_nllb
      - key: DEFAULT_TARGET_LANGUAGE
        value: English
